{% extends "base.html" %}

{% block content %}

<div class="section">

    <h1>장학금</h1>

    {% if scholarships %}

    <table class="info-table">

        <tr>
            <th>장학금명</th>
            <th>대상</th>
            <th>마감일</th>
        </tr>

        {% for scholarship in scholarships %}

        <tr>
            <td>{{ scholarship.title }}</td>
            <td>{{ scholarship.target }}</td>
            <td>{{ scholarship.deadline }}</td>
        </tr>

        {% endfor %}

    </table>

    {% else %}

    <div class="empty-box">
        현재 등록된 장학금이 없습니다.
    </div>

    {% endif %}

</div>

{% endblock %}
